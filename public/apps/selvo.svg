<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9C9CA6"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2A31"/>
      <stop offset="1" stop-color="#0B0B0E"/>
    </linearGradient>
  </defs>
  <!-- Selvo growth mark: three ascending bars -->
  <rect width="48" height="48" fill="url(#frame)"/>
  <rect x="12" y="27" width="6" height="10" rx="2.2" fill="url(#bar)" opacity=".55"/>
  <rect x="21" y="20" width="6" height="17" rx="2.2" fill="url(#bar)" opacity=".8"/>
  <rect x="30" y="12" width="6" height="25" rx="2.2" fill="url(#bar)"/>
</svg>
